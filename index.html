<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>黎老师中文班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --surface-2:#E9EEEB; --ink:#16212A; --ink-2:#51606B; --line:#D3DCD7;
  --accent:#0D7563; --accent-ink:#FFFFFF; --accent-soft:#D4EDE6; --seal:#B23F2C;
  --good:#2C8649; --good-soft:#DCF0E2; --warn:#A96F17; --warn-soft:#F6EBD4; --bad:#BE3A2E; --bad-soft:#F7DEDA;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 4px 16px rgba(20,40,35,.06);
  --hz:"Noto Serif SC","Songti SC","SimSun",serif;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1417; --surface:#162025; --surface-2:#1E2A30; --ink:#E4EBE8; --ink-2:#9AA9B1; --line:#2A3A41;
    --accent:#3DB39B; --accent-ink:#04201A; --accent-soft:#163A33; --seal:#E27560;
    --good:#5DBB7C; --good-soft:#193426; --warn:#D9A544; --warn-soft:#3A2F17; --bad:#E86A5D; --bad-soft:#3E1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1417; --surface:#162025; --surface-2:#1E2A30; --ink:#E4EBE8; --ink-2:#9AA9B1; --line:#2A3A41;
  --accent:#3DB39B; --accent-ink:#04201A; --accent-soft:#163A33; --seal:#E27560;
  --good:#5DBB7C; --good-soft:#193426; --warn:#D9A544; --warn-soft:#3A2F17; --bad:#E86A5D; --bad-soft:#3E1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
.hz{font-family:var(--hz);font-weight:500}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--seal);color:#fff;font-family:var(--hz);font-size:17px;font-weight:700}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;text-wrap:balance}
h2{font-size:19px;margin:0 0 12px;text-wrap:balance}
h3{font-size:16px;margin:0 0 8px}
.lede{color:var(--ink-2);margin:0 0 20px;max-width:65ch}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:16px}
.sp{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:16px;height:16px}
.field{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.field select,.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px;color:var(--ink);min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* roadmap */
.book-head{display:flex;align-items:baseline;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.book-head .hz{font-size:20px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;text-align:left;color:inherit}
button.lesson:hover{border-color:var(--accent)}
.lesson.done{border-color:var(--accent)}
.lesson-num{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lesson-num b{font-size:18px;line-height:1.4}
.lesson-num b .hz{font-size:22px;font-weight:700;margin-left:4px}
.lesson .words{font-family:var(--hz);font-size:17px;color:var(--ink);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.lesson.soon{opacity:.6;border-style:dashed;background:transparent}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--ink-2)}

/* vocab table */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters .field{flex:1 1 160px}
.lesson-picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.lesson-pick{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.lesson-pick:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lesson-pick input{margin-top:4px;accent-color:var(--accent);flex:none}
.lesson-pick span{min-width:0;line-height:1.35}.lesson-pick .hz{font-weight:700}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.w{font-family:var(--hz);font-size:20px;white-space:nowrap}
td.py{white-space:nowrap;color:var(--accent);font-weight:500}
td.ex{font-family:var(--hz);font-size:14px;color:var(--ink-2);max-width:380px}
.lvl{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}
.lvl.l1{background:var(--warn)}.lvl.l2{background:var(--accent)}.lvl.l3{background:var(--good)}

/* flashcard */
.fc-wrap{display:grid;gap:16px;max-width:620px;margin:0 auto}
.card{position:relative;min-height:320px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;padding:28px 20px;cursor:pointer;user-select:none}
.card .big{font-family:var(--hz);font-size:clamp(56px,14vw,92px);line-height:1.1;font-weight:500}
.card .vi{font-size:clamp(22px,5vw,30px);font-weight:600;text-wrap:balance}
.card .py{color:var(--accent);font-size:22px;font-weight:500;margin-top:6px}
.card .meta{margin-top:10px}
.card .exs{font-family:var(--hz);font-size:17px;margin-top:16px;color:var(--ink-2);max-width:48ch;text-wrap:pretty}
.card .hint{position:absolute;bottom:12px;left:0;right:0;font-size:12px;color:var(--ink-2)}
.card .spk{position:absolute;top:12px;right:12px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;display:grid;gap:2px}
.rate button small{font-weight:400;color:var(--ink-2);font-size:11px}
.rate .r0{border-color:var(--bad);color:var(--bad)}
.rate .r1{border-color:var(--warn);color:var(--warn)}
.rate .r2{border-color:var(--accent);color:var(--accent)}
.rate .r3{border-color:var(--good);color:var(--good)}
.progress-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-2)}

/* quiz */
.q{max-width:680px;margin:0 auto;display:grid;gap:14px}
.q-prompt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.q-prompt .big{font-family:var(--hz);font-size:52px;line-height:1.15}
.q-prompt .sent{font-family:var(--hz);font-size:21px;line-height:1.7;text-wrap:pretty}
.q-prompt .blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--accent);margin:0 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.opt .t-hz{font-family:var(--hz);font-size:22px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);background:var(--surface);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px}
.explain .hz{font-size:16px}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;font-family:var(--hz);font-size:24px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center}

/* grammar */
.gp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gp summary{list-style:none;padding:16px 18px;display:flex;gap:12px;align-items:center;cursor:pointer;flex-wrap:wrap}
.gp summary::-webkit-details-marker{display:none}
.gp summary .hz{font-size:20px}
.gp[open] summary{border-bottom:1px solid var(--line)}
.gp-body{padding:16px 18px;display:grid;gap:14px}
.formula{font-family:var(--hz);font-size:18px;background:var(--surface-2);padding:10px 14px;border-radius:8px;overflow-x:auto}
.ex-list{margin:0;padding-left:18px;display:grid;gap:6px}
.ex-list .hz{font-size:17px}
.mini-q{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.mini-q .sent{font-family:var(--hz);font-size:18px}
.mini-opts{display:flex;gap:8px;flex-wrap:wrap}
.mini-opts .opt{min-height:0;padding:6px 14px}
.mini-opts .opt .t-hz{font-size:18px}

/* mock */
.exam-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.timer.low{color:var(--bad)}
.palette{display:flex;flex-wrap:wrap;gap:4px}
.palette button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums}
.palette button.ans{background:var(--accent-soft);border-color:var(--accent)}
.palette button.cur{outline:2px solid var(--ink);outline-offset:1px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.part .hz{font-size:22px}
.part ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.score-big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* speaking exam guide */
.speaking-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#514FC5,#7B72E7);color:#fff;border-radius:24px;padding:clamp(24px,5vw,48px);margin-bottom:18px;box-shadow:0 20px 46px rgba(80,75,190,.22)}
.speaking-hero:after{content:"说";position:absolute;right:28px;bottom:-34px;font-family:var(--hz);font-size:160px;line-height:1;color:rgba(255,255,255,.08);pointer-events:none}.speaking-hero h1{color:#fff;max-width:760px}.speaking-hero .lede{color:rgba(255,255,255,.82);margin-bottom:16px}.speaking-meta{display:flex;gap:8px;flex-wrap:wrap}.speaking-meta .chip{background:rgba(255,255,255,.16);color:#fff}
.speaking-jumps{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}.speaking-jumps::-webkit-scrollbar{display:none}.speaking-jumps .btn{white-space:nowrap;flex:none}
.speaking-type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.speaking-type-card{position:relative;min-height:220px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);padding:24px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 1px 0 rgba(31,31,47,.06);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}.speaking-type-card:first-child{grid-column:span 2;min-height:240px;background:linear-gradient(135deg,#fff,#F0EFFF)}.speaking-type-card:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(38,36,65,.12)}.speaking-type-number{font-size:13px;color:var(--ink-2);font-weight:700;letter-spacing:.08em}.speaking-type-hz{position:absolute;right:20px;top:10px;font-size:76px;font-weight:700;color:var(--accent);opacity:.1}.speaking-type-card .eyebrow{margin-top:auto}.speaking-type-card strong{font-size:clamp(22px,3vw,32px);line-height:1.18;letter-spacing:-.035em;max-width:15ch;margin-top:5px}.speaking-type-open{margin-top:18px;color:var(--accent);font-weight:650}.speaking-detail{display:grid;gap:16px}.speaking-back{justify-self:start}
.speaking-layout{display:grid;gap:16px}.speaking-section{scroll-margin-top:26px}.speaking-section>summary{list-style:none;cursor:pointer;padding:20px 22px;display:flex;align-items:center;gap:12px}.speaking-section>summary::-webkit-details-marker{display:none}.speaking-section>summary:after{content:"＋";margin-left:auto;color:var(--accent);font-size:22px}.speaking-section[open]>summary:after{content:"−"}.speaking-section[open]>summary{border-bottom:1px solid var(--line)}.speaking-section>summary b{font-size:20px}.speaking-body{padding:22px;display:grid;gap:18px}
.speaking-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.speaking-card{background:var(--surface-2);border-radius:13px;padding:14px}.speaking-card b{display:block;margin-bottom:4px}.speaking-list{margin:0;padding-left:22px;display:grid;gap:7px}.phrase-box{border-left:4px solid var(--accent);background:var(--accent-soft);padding:13px 15px;border-radius:0 12px 12px 0;line-height:1.8}.phrase-box .hz{font-size:16px;font-weight:600}.speaking-table{overflow-x:auto;border:1px solid var(--line);border-radius:14px}.speaking-table table{min-width:840px;background:var(--surface)}.speaking-table td:nth-child(1){width:110px;font-weight:700;color:var(--accent)}.speaking-table td:nth-child(2){font-family:var(--hz);font-size:17px;line-height:1.7}.speaking-table td:nth-child(3){color:var(--accent);font-weight:500}.speaking-table td:nth-child(4){min-width:260px}.speaking-table.general table{min-width:690px}.speaking-table.general td{font-family:var(--ui);font-size:14px;color:inherit;font-weight:400}.speaking-table.general td:first-child{color:var(--ink);font-weight:650}.speaking-callout{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:15px 17px}.speaking-callout b{color:var(--warn)}
@media(max-width:620px){.speaking-hero{border-radius:18px;margin-inline:-4px}.speaking-hero:after{font-size:110px}.speaking-section>summary,.speaking-body{padding:16px}.speaking-section>summary b{font-size:17px}.speaking-type-grid{grid-template-columns:1fr}.speaking-type-card:first-child{grid-column:auto}.speaking-type-card{min-height:190px;padding:20px}}

/* lesson reference answers */
.lesson-collapsible{background:var(--surface);border:0;border-radius:18px;box-shadow:0 1px 0 rgba(31,31,47,.06);overflow:hidden}.lesson-collapsible>summary{list-style:none;cursor:pointer;padding:20px 22px;display:flex;align-items:center;gap:14px}.lesson-collapsible>summary::-webkit-details-marker{display:none}.lesson-collapsible[open]>summary{border-bottom:1px solid var(--line)}.lesson-collapsible>summary h2{margin:0}.collapse-label{margin-left:auto;color:var(--accent);font-weight:650;font-size:13px}.collapse-label:after{content:"Mở rộng"}.lesson-collapsible[open] .collapse-label:after{content:"Thu gọn"}.lesson-collapsible-body{padding:20px 22px}
.lesson-references{display:grid;gap:14px;margin-top:2px}.grammar-strip{background:var(--accent-soft);color:var(--ink);border-radius:13px;padding:13px 15px}.grammar-strip .hz{font-size:16px}.reference-card{background:var(--surface);border:0;border-radius:18px;box-shadow:0 1px 0 rgba(31,31,47,.06);overflow:hidden}.reference-card>summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:flex-start;gap:12px}.reference-card>summary::-webkit-details-marker{display:none}.reference-card>summary:after{content:"＋";margin-left:auto;color:var(--accent);font-size:22px;line-height:1}.reference-card[open]>summary{border-bottom:1px solid var(--line)}.reference-card[open]>summary:after{content:"−"}.reference-card>summary .hz{font-size:19px;font-weight:700;line-height:1.45}.reference-number{flex:none;background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}.reference-body{padding:20px;display:grid;gap:16px}.reference-type{color:var(--ink-2)}.reference-outline{overflow-x:auto;border:1px solid var(--line);border-radius:13px}.reference-outline table{min-width:650px}.reference-outline td:first-child{width:110px;font-weight:700;color:var(--accent)}.reference-outline td:nth-child(3){font-family:var(--hz);font-size:16px}.reference-answer,.reference-meaning{padding:16px;border-radius:13px}.reference-answer{background:var(--surface-2)}.reference-answer p{font-size:19px;line-height:1.85;margin:6px 0 0}.reference-meaning{border:1px solid var(--line)}.reference-meaning p{margin:6px 0 0;line-height:1.75}.reference-note{background:var(--warn-soft);border-radius:12px;padding:13px 15px}.reference-note b{color:var(--warn)}

function speak(text, rate) {
  try {
    const s = window.speechSynthesis;
    if (!s) { toast('Trình duyệt này không hỗ trợ đọc tiếng Trung.'); return; }
    s.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = rate || 0.9;
    const vs = s.getVoices();
    const v = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    s.speak(u);
  } catch (e) { toast('Không phát được âm thanh.'); }
}

/* ---------- authentication & progress ---------- */
const A_KEY = 'hsk4:active';
const STUDENT_EMAILS = Object.freeze({
  thuytien:'thuytien@students.lelaoshi.vn',
  kieuoanh:'kieuoanh@students.lelaoshi.vn',
  ngocoanh:'ngocoanh@students.lelaoshi.vn'
});
const EMAIL_TO_STUDENT = Object.fromEntries(Object.entries(STUDENT_EMAILS).map(([name, email]) => [email, name]));
const SB_CONFIG = window.HSK_SUPABASE_CONFIG || {};
const authConfigured = /^https:\/\/.+\.supabase\.co$/.test(SB_CONFIG.url || '') && /^sb_publishable_/.test(SB_CONFIG.publishableKey || '');
let sb = null, authUser = null, remoteSaveTimer = null;
let active = LS.get(A_KEY, 'Học viên 1');
const blank = () => ({ srs:{}, quiz:{total:0, correct:0}, wrongs:{}, done:[], mocks:[] });
let P = Object.assign(blank(), LS.get('hsk4:p:' + active, {}));
const saveLocal = () => { LS.set('hsk4:p:' + active, P); LS.set(A_KEY, active); };
const save = () => {
  saveLocal();
  if (sb && authUser) {
    clearTimeout(remoteSaveTimer);
    remoteSaveTimer = setTimeout(syncRemoteProgress, 500);
  }
};
function updateAuthUI() {
  $('#loginBtn').hidden = !!authUser;
  $('#authUser').hidden = !authUser;
  if (authUser) {
    $('#authName').textContent = active;
    $('#authAvatar').textContent = active.slice(0, 1);
  }
}
function showAuth(required = false) {
  $('#authModal').hidden = false;
  $('#authClose').hidden = required;
  $('#authSetupNote').hidden = authConfigured;
  $('#authError').hidden = true;
  document.body.classList.toggle('auth-required', required);
  setTimeout(() => $('#loginUsername').focus(), 30);
}
function hideAuth() {
  if (document.body.classList.contains('auth-required')) return;
  $('#authModal').hidden = true;
}
async function syncRemoteProgress() {
  if (!sb || !authUser) return;
  const { error } = await sb.from('student_progress').upsert({ user_id:authUser.id, progress:P, updated_at:new Date().toISOString() }, { onConflict:'user_id' });
  if (error) console.error('Không lưu được tiến độ:', error.message);
}
async function loadRemoteProgress() {
  if (!sb || !authUser) return;
  const { data, error } = await sb.from('student_progress').select('progress').eq('user_id', authUser.id).maybeSingle();
  if (error) { toast('Không tải được tiến độ từ Supabase.'); console.error(error); return; }
  if (data && data.progress) P = Object.assign(blank(), data.progress);
  else await syncRemoteProgress();
  saveLocal();
}
async function applySession(session) {
  if (!session || !session.user) return false;
  if (authUser && authUser.id === session.user.id) return true;
  const email = String(session.user.email || '').toLowerCase();
  const username = EMAIL_TO_STUDENT[email] || session.user.user_metadata?.username;
  if (!STUDENT_EMAILS[username]) { await sb.auth.signOut(); return false; }
  authUser = session.user;
  active = username;
  P = Object.assign(blank(), LS.get('hsk4:p:' + active, {}));
  saveLocal();
  await loadRemoteProgress();
  document.body.classList.remove('auth-required');
  $('#authModal').hidden = true;
  updateAuthUI();
  route();
  return true;
}
async function initAuth() {
  updateAuthUI();
  route();
  if (!authConfigured || !window.supabase?.createClient) return;
  sb = window.supabase.createClient(SB_CONFIG.url, SB_CONFIG.publishableKey);
  const { data } = await sb.auth.getSession();
  if (!(await applySession(data.session))) showAuth(true);
  sb.auth.onAuthStateChange((event, session) => setTimeout(() => {
    if (event === 'SIGNED_IN' && session) applySession(session);
    if (event === 'SIGNED_OUT') {
      authUser = null;
      active = 'Học viên 1'; P = Object.assign(blank(), LS.get('hsk4:p:' + active, {}));
      updateAuthUI(); route(); showAuth(true);
    }
  }, 0));
}
$('#loginBtn').addEventListener('click', () => showAuth(authConfigured && !authUser));
$('#authClose').addEventListener('click', hideAuth);
$('#authModal').addEventListener('click', e => { if (e.target === $('#authModal')) hideAuth(); });
$('#logoutBtn').addEventListener('click', async () => { if (sb) await sb.auth.signOut(); });
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = $('#loginUsername').value.trim().toLowerCase();
  const password = $('#loginPassword').value;
  const errorBox = $('#authError'), submit = $('#loginSubmit');
  if (!authConfigured || !window.supabase?.createClient) {
    errorBox.textContent = 'Supabase chưa được cấu hình. Hãy làm theo hướng dẫn thiết lập bên dưới.'; errorBox.hidden = false; return;
  }
  if (!STUDENT_EMAILS[username]) {
    errorBox.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.'; errorBox.hidden = false; return;
  }
  submit.disabled = true; submit.textContent = 'Đang đăng nhập…'; errorBox.hidden = true;
  const { data, error } = await sb.auth.signInWithPassword({ email:STUDENT_EMAILS[username], password });
  submit.disabled = false; submit.textContent = 'Đăng nhập';
  if (error || !(await applySession(data.session))) {
    errorBox.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.'; errorBox.hidden = false;
  }
});

const box = id => (P.srs[id] && P.srs[id].box) || 0;
const seen = id => !!P.srs[id];
const isDue = id => P.srs[id] && P.srs[id].due <= Date.now();
const known = id => box(id) >= 3;
const INTERVALS = [0, 1, 2, 4, 7, 15, 30, 60];
function rateCard(id, r) {
  const s = P.srs[id] || { box:0, due:0, reps:0, lapses:0 };
  s.reps++;
  if (r === 0) { s.box = 0; s.lapses++; s.due = Date.now() + 60e3; P.wrongs[id] = (P.wrongs[id] || 0) + 1; }
  else if (r === 1) { s.box = Math.max(1, s.box); s.due = Date.now() + DAY; }
  else if (r === 2) { s.box = Math.min(7, s.box + 1); s.due = Date.now() + INTERVALS[s.box] * DAY; }
  else { s.box = Math.min(7, s.box + 2); s.due = Date.now() + INTERVALS[s.box] * DAY * 1.3; }
  P.srs[id] = s; save();
}
function recordAnswer(id, ok) {
  P.quiz.total++; if (ok) P.quiz.correct++;
  if (!ok) {
    P.wrongs[id] = (P.wrongs[id] || 0) + 1;
    const s = P.srs[id] || { box:0, due:0, reps:0, lapses:0 };
    s.box = 0; s.due = Date.now(); P.srs[id] = s;
  }
  save();
}

function startFlash() {
  const c = fc.cfg;
  if (!Array.isArray(c.lessons) || !c.lessons.length) { toast('Hãy chọn ít nhất một bài.'); return; }
  const pool = poolFor(c.lessons);
  let deck;
  if (c.src === 'wrong') deck = pool.filter(w => P.wrongs[w.id]).sort((a, b) => P.wrongs[b.id] - P.wrongs[a.id]);
  else if (c.src === 'all') deck = shuffle(pool);
  else deck = shuffle(pool.filter(w => isDue(w.id))).concat(shuffle(pool.filter(w => !seen(w.id)))).slice(0, 20);
  if (!deck.length) { toast(c.src === 'wrong' ? 'Chưa có từ sai nào trong các bài đã chọn.' : 'Không còn từ đến hạn. Chọn "Toàn bộ từ trong các bài đã chọn" để ôn thêm.'); if (location.hash !== '#flashcard') go('flashcard'); return; }
  Object.assign(fc, { deck:deck.map(w => w.id), i:0, flipped:false, done:0 });
  if (location.hash !== '#flashcard') { history.replaceState(null, '', '#flashcard'); }
  renderTabsOnly('flashcard'); drawCard();
}
ACTIONS.startFlash = startFlash;
function renderTabsOnly(tab) { $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" data-go="${k}" ${k === tab ? 'aria-current="page"' : ''}>${l}</button>`).join(''); }

document.addEventListener('keydown', e => {

/* ---------- question generators ---------- */
function pickDistractors(w, n, keyFn, extraFilter) {
  const seenK = new Set([keyFn(w)]), out = [];
  const same = shuffle(VOCAB.filter(x => x.id !== w.id && x.tuLoai === w.tuLoai));
  const rest = shuffle(VOCAB.filter(x => x.id !== w.id && x.tuLoai !== w.tuLoai));
  for (const x of same.concat(rest)) {
    if (out.length >= n) break;
    const k = keyFn(x); if (seenK.has(k) || (extraFilter && !extraFilter(x))) continue;
    seenK.add(k); out.push(x);
  }
  return out;
}
const mkOpts = (w, ds, keyFn) => shuffle([w].concat(ds)).map(x => ({ label:keyFn(x), correct:x.id === w.id }));
const explainOf = w => `<span class="hz">${h(w.tu)}</span> <b>${h(w.pinyin)}</b> · ${h(w.tuLoai)} · ${h(w.nghia)}<br><span class="hz muted">${h(w.viDu)}</span>`;
const GEN = {
  nghia: w => ({ type:'nghia', wid:w.id, ask:'Chọn nghĩa đúng', prompt:`<div class="big">${h(w.tu)}</div>`, hz:false, opts:mkOpts(w, pickDistractors(w, 3, x => x.nghia), x => x.nghia) }),
  tu: w => ({ type:'tu', wid:w.id, ask:'Chọn từ có nghĩa là', prompt:`<div style="font-size:24px;font-weight:600">${h(w.nghia)}</div><span class="chip">${h(w.tuLoai)}</span>`, hz:true, opts:mkOpts(w, pickDistractors(w, 3, x => x.tu), x => x.tu) }),
  pinyin: w => ({ type:'pinyin', wid:w.id, ask:'Chọn phiên âm đúng', prompt:`<div class="big">${h(w.tu)}</div>`, hz:false, opts:mkOpts(w, pickDistractors(w, 3, x => x.pinyin), x => x.pinyin) }),
  dien: w => {
    const sent = w.viDu;
    return { type:'dien', wid:w.id, ask:'Chọn từ điền vào chỗ trống', prompt:`<div class="sent">${h(sent).split(h(w.tu)).join('<span class="blank"></span>')}</div>`, hz:true,
      opts:mkOpts(w, pickDistractors(w, 3, x => x.tu, x => !sent.includes(x.tu)), x => x.tu) };
  },
  nghe: w => ({ type:'nghe', wid:w.id, ask:'Nghe và chọn nghĩa đúng', say:w.tu, prompt:`<button class="btn pri" data-say="${h(w.tu)}" data-rate="0.8">${ICON.spk.replace('<svg', '<svg width="18" height="18"')} Nghe lại</button>`, hz:false, opts:mkOpts(w, pickDistractors(w, 3, x => x.nghia), x => x.nghia) }),
  ngheCau: w => ({ type:'ngheCau', wid:w.id, ask:'Nghe câu và chọn từ xuất hiện trong câu', say:w.viDu, prompt:`<button class="btn pri" data-say="${h(w.viDu)}" data-rate="0.85">${ICON.spk.replace('<svg', '<svg width="18" height="18"')} Nghe lại câu</button>`, hz:true, reveal:w.viDu,
    opts:mkOpts(w, pickDistractors(w, 3, x => x.tu, x => !w.viDu.includes(x.tu)), x => x.tu) }),
  viet: w => ({ type:'viet', wid:w.id, ask:'Viết chữ Hán cho từ sau', prompt:`<div style="font-size:22px;font-weight:600">${h(w.nghia)}</div><div style="color:var(--accent);font-size:20px">${h(w.pinyin)}</div>`, answer:w.tu })
};

      <span class="chip ${total >= 180 ? 'good' : 'bad'}" style="font-size:14px;padding:4px 12px">${total >= 180 ? 'Đạt (≥180)' : 'Chưa đạt (cần 180)'}</span>
      <span class="sp"></span>
      ${MOCK_PARTS.map(([k, l]) => `<div><div class="small muted hz">${l}</div><b style="font-size:20px;font-variant-numeric:tabular-nums">${parts[k]}</b><span class="small muted"> · ${right[k]}/${count[k]} câu</span></div>`).join('')}
    </div>
    <div class="row"><button class="btn pri" data-go="thi-thu">Về trang thi thử</button><button class="btn" data-act="wrongFlash">Ôn từ sai bằng flashcard</button></div>
    ${wrongList.length ? `<h2 style="margin:8px 0 0">Xem lại ${wrongList.length} câu sai</h2>
      <div class="stack">${wrongList.map(([q, i]) => { const a = mock.ans[i]; return `<div class="panel"><div class="eyebrow" style="margin-bottom:8px">Câu ${i + 1} · ${MOCK_PARTS.find(p => p[0] === q.part)[1]}</div>${qBody(q, { chosen:typeof a === 'number' ? a : null, typed:typeof a === 'string' ? a : '', reveal:true })}</div>`; }).join('')}</div>` : '<p>Bạn làm đúng tất cả các câu.</p>'}
  </div>`;
}

/* ---------- 7. Progress ---------- */
function reportText() {
  const acc = P.quiz.total ? Math.round(P.quiz.correct / P.quiz.total * 100) : 0;
  const wr = Object.entries(P.wrongs).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id, n]) => `${byId[id]?.tu}(${n})`).join(', ');
  return `Báo cáo HSK4 – ${active} – ${new Date().toLocaleDateString('vi-VN')}
Từ đã nhớ: ${VOCAB.filter(w => known(w.id)).length}/${VOCAB.length}; đã học qua: ${Object.keys(P.srs).length}
Luyện tập: ${P.quiz.correct}/${P.quiz.total} câu đúng (${acc}%)
Bài đã học: ${P.done.sort((a, b) => a - b).join(', ') || 'chưa đánh dấu'}
Từ hay sai: ${wr || 'không có'}`;
}
function renderProgress(v) {
  const wrongs = Object.entries(P.wrongs).sort((a, b) => b[1] - a[1]).slice(0, 15);
  const perLesson = BOOK_A.concat('khac').map(b => { const ws = lessonWords(b); return [b, ws.filter(w => known(w.id)).length, ws.filter(w => seen(w.id)).length, ws.length]; });
  const acc = P.quiz.total ? Math.round(P.quiz.correct / P.quiz.total * 100) + '%' : '–';
  v.innerHTML = `<h1>Tiến độ của bạn</h1>
    <p class="lede">Dữ liệu lưu trên trình duyệt của máy này. Mỗi học viên nên dùng một hồ sơ riêng; gửi báo cáo cho giáo viên bằng nút sao chép bên dưới.</p>
    <div class="summary">
      <div class="stat"><b>${Object.keys(P.srs).length}</b><span>từ đã học qua</span></div>
      <div class="stat"><b>${VOCAB.filter(w => known(w.id)).length}</b><span>từ đã nhớ chắc</span></div>
      <div class="stat"><b>${acc}</b><span>đúng trên ${P.quiz.total} câu</span></div>
    </div>
    <div class="stack" style="margin-top:20px">
      <section class="panel"><h2>Theo bài</h2>
        <div class="stack" style="gap:10px">${perLesson.map(([b, k, s, n]) => { const info = lessonInfo(b); const name = `${lessonLabel(b)}${info ? ` · ${h(info.title)}` : ''}`; return `<div class="row" style="gap:10px;flex-wrap:nowrap">${info ? `<button class="btn ghost small" data-go="bai-${b}" style="width:clamp(120px,32vw,240px);flex:none;justify-content:flex-start;text-align:left;white-space:normal">${name}</button>` : `<span style="width:clamp(120px,32vw,240px);flex:none" class="small">${name}</span>`}<div class="bar sp" style="height:8px"><i style="width:${n ? k / n * 100 : 0}%"></i></div><span class="small muted" style="width:120px;flex:none;text-align:right;font-variant-numeric:tabular-nums">nhớ ${k} · học ${s}/${n}</span></div>`; }).join('')}</div>
      </section>
      <section class="panel"><h2>Từ hay sai</h2>
        ${wrongs.length ? `<div class="list">${wrongs.map(([id, n]) => { const w = byId[id]; return w ? `<div class="list-item"><span class="hz">${h(w.tu)}</span><span class="small"><b style="color:var(--accent)">${h(w.pinyin)}</b> · ${h(w.nghia)}</span><span class="sp"></span><span class="chip bad">sai ${n} lần</span>${spkBtn(w.tu)}</div>` : ''; }).join('')}</div>
          <div style="margin-top:12px"><button class="btn pri" data-act="wrongFlash">Ôn các từ này</button></div>` : '<p class="muted" style="margin:0">Chưa có từ sai nào. Làm vài lượt luyện tập để hệ thống ghi nhận.</p>'}
      </section>
      <section class="panel"><h2>Báo cáo cho giáo viên</h2>
        <pre id="report" style="white-space:pre-wrap;font-family:var(--ui);font-size:13px;background:var(--surface-2);padding:12px;border-radius:8px;margin:0 0 12px">${h(reportText())}</pre>
        <button class="btn" data-act="copyReport">Sao chép báo cáo</button>
      </section>
      <section class="panel"><h2>Tài khoản học viên</h2>
        <p class="muted" style="margin:0 0 12px">${authUser ? `Đang đăng nhập với tài khoản <b>${h(active)}</b>. Tiến độ được đồng bộ với Supabase.` : 'Chưa đăng nhập. Tiến độ hiện chỉ được lưu trên trình duyệt này.'}</p>
        <div class="row" id="resetBox"><button class="btn ghost" data-act="askReset" style="color:var(--bad)">Xóa tiến độ của ${h(active)}</button></div>
      </section>
    </div>`;
}
ACTIONS.copyReport = () => {
  const txt = reportText();
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#report')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Đã chọn sẵn nội dung, nhấn Ctrl+C để sao chép.'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('Đã sao chép báo cáo.'), fallback); } catch (e) { fallback(); }
};
ACTIONS.askReset = () => { $('#resetBox').innerHTML = `<span>Xóa toàn bộ lịch ôn và điểm luyện tập của ${h(active)}?</span><button class="btn" data-go="tien-do">Hủy</button><button class="btn" style="border-color:var(--bad);color:var(--bad)" data-act="doReset">Xóa</button>`; };
ACTIONS.doReset = () => { P = blank(); save(); toast('Đã xóa tiến độ.'); route(); };

initAuth();
</script>

</body></html>
